<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ရွှေအလေးချိန် Auto တွက်စက်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
box-sizing: border-box;
font-family: 'Inter', 'Padauk', sans-serif;
}

body {
margin: 0;
padding: 12px;
background: #0b1120;
color: #f1f5f9;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}

/* Screen Size ကို 480px သို့ ထပ်မံချဲ့ပေးထားပါသည် */
.calc-card {
width: 100%;
max-width: 480px;
background: #162032;
border-radius: 16px;
padding: 20px;
box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
border: 1px solid #24334d;
}

.title {
text-align: center;
color: #facc15;
font-size: 18px;
margin: 0 0 14px 0;
font-weight: 700;
}

.field { margin-bottom: 10px; }

.field label {
display: block;
font-size: 12px;
color: #94a3b8;
margin-bottom: 4px;
font-weight: 700;
}

select, input {
width: 100%;
padding: 9px 12px;
border-radius: 8px;
border: 1px solid #24334d;
background: #0b1120;
color: #ffffff;
font-size: 14px;
font-weight: 600;
outline: none;
}

select { color: #38bdf8; font-size: 13px; }

/* မီးလင်းစျေး (အဝါရောင်) */
.yellow-label { color: #facc15 !important; }
.yellow-input { border-color: #eab308 !important; color: #fef08a !important; }
.yellow-input:focus { border-color: #facc15 !important; box-shadow: 0 0 8px rgba(250, 204, 21, 0.4); }
.yellow-input::placeholder { color: #facc15; opacity: 0.6; }

/* ကျွတ်နှုန်း (အနီရောင်) */
.red-label { color: #f87171 !important; }
.red-input { border-color: #ef4444 !important; color: #fca5a5 !important; }
.red-input:focus { border-color: #dc2626 !important; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
.red-input::placeholder { color: #f87171; opacity: 0.7; }

/* တွင်းထွက်စျေး (ခရမ်းရောင်) */
.purple-label { color: #c084fc !important; }
.purple-input { border-color: #a855f7 !important; color: #e9d5ff !important; }
.purple-input:focus { border-color: #c084fc !important; box-shadow: 0 0 8px rgba(192, 132, 252, 0.4); }
.purple-input::placeholder { color: #c084fc; opacity: 0.7; }

/* Gram (အစိမ်းရောင်) */
.green-label { color: #34d399 !important; }
.green-input { border-color: #10b981 !important; color: #a7f3d0 !important; }
.green-input:focus { border-color: #34d399 !important; box-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
.green-input::placeholder { color: #34d399; opacity: 0.7; }

.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 10px;
}

.kpy-grid {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
margin-bottom: 12px;
}

/* ကျပ် ပဲ ရွေး စာသားများကို ထင်းအောင် လုပ်ထားသည် */
.kpy-box { text-align: center; }
.kpy-box .lbl-kyat { display: block; font-size: 13px; color: #38bdf8; margin-bottom: 4px; font-weight: 700; }
.kpy-box .lbl-pe { display: block; font-size: 13px; color: #34d399; margin-bottom: 4px; font-weight: 700; }
.kpy-box .lbl-yew { display: block; font-size: 13px; color: #facc15; margin-bottom: 4px; font-weight: 700; }
.kpy-box input { text-align: center; font-size: 15px; }

.main-res {
background: #0b1120;
border-radius: 10px;
padding: 12px 14px;
border: 1px solid #24334d;
margin-bottom: 12px;
}

.res-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
}

.res-row:last-child { margin-bottom: 0; }
.res-lbl { font-size: 12px; color: #94a3b8; font-weight: 500; }

.val-gold { color: #facc15; font-weight: 700; font-size: 14px; }
.val-emerald { color: #34d399; font-weight: 700; font-size: 14px; }
.val-white { color: #ffffff; font-weight: 700; font-size: 13px; }

.cmp-wrap {
background: #0b1120;
border-radius: 10px;
padding: 10px 12px;
border: 1px solid #24334d;
}

.cmp-head {
font-size: 11px;
color: #64748b;
margin-bottom: 6px;
text-align: center;
font-weight: 700;
}

.cmp-item {
display: flex;
justify-content: space-between;
align-items: center;
background: #162032;
padding: 6px 10px;
border-radius: 6px;
margin-bottom: 5px;
}

.cmp-item:last-child { margin-bottom: 0; }
.cmp-tag { font-size: 11px; color: #38bdf8; font-weight: 700; }
.cmp-val { font-size: 12px; color: #facc15; font-weight: 700; }
.cmp-sub { font-size: 11px; color: #34d399; margin-left: 4px; }
</style>
</head>
<body>

<div class="calc-card">
<div class="title">ရွှေအလေးချိန် Auto တွက်စက်</div>

<div class="field">
<label>စံနှုန်းရွေးပါ</label>
<select id="gramStandard" onchange="autoCalcRawPrice(); calculateFromKPY();">
<option value="1">16.6 Gram (120 ရွေး)</option>
<option value="2" selected>16.606 Gram (128 ရွေး)</option>
<option value="3">16.329325 Gram (128 ရွေး)</option>
</select>
</div>

<!-- မီးလင်းစျေး (အဝါ) + ကျွတ်နှုန်း (အနီ) -->
<div class="grid-2">
<div class="field" style="margin-bottom:0;">
<label class="yellow-label">မီးလင်းရွှေစျေး</label>
<input type="number" id="goldPrice" class="yellow-input" placeholder="မီးလင်းစျေး" oninput="autoCalcRawPrice(); calculateFromKPY();">
</div>
<div class="field" style="margin-bottom:0;">
<label class="red-label">ကျွတ်နှုန်း (ရွေး)</label>
<input type="number" id="wasteYew" class="red-input" placeholder="ရွှေကျွတ်နှုန်းထည့်ရန်" oninput="autoCalcRawPrice(); calculateFromKPY();">
</div>
</div>

<!-- တွင်းထွက်စျေး (ခရမ်း) + Gram (အစိမ်း) -->
<div class="grid-2">
<div class="field" style="margin-bottom:0;">
<label class="purple-label">တွင်းထွက်စျေး (Auto)</label>
<input type="number" id="rawPrice" class="purple-input" placeholder="အကြမ်းစျေး" oninput="calculateFromKPY()">
</div>
<div class="field" style="margin-bottom:0;">
<label class="green-label">Gram ဖြင့် ရိုက်ထည့်ရန်</label>
<input type="number" id="inputGram" class="green-input" placeholder="Gram ပမာဏ" oninput="calculateFromGram()">
</div>
</div>

<!-- ကျပ်/ပဲ/ရွေး စာသားများ ထင်းလင်းအောင် ပြုလုပ်ထားပါသည် -->
<div class="kpy-grid" style="margin-top: 10px;">
<div class="kpy-box">
<span class="lbl-kyat">ကျပ်</span>
<input type="number" id="kyat" placeholder="၀" oninput="calculateFromKPY()">
</div>
<div class="kpy-box">
<span class="lbl-pe">ပဲ</span>
<input type="number" id="pe" placeholder="၀" oninput="calculateFromKPY()">
</div>
<div class="kpy-box">
<span class="lbl-yew">ရွေး</span>
<input type="number" id="yew" placeholder="၀" oninput="calculateFromKPY()">
</div>
</div>

<!-- ပင်မ အဖြေပြရန် -->
<div class="main-res">
<div class="res-row">
<span class="res-lbl">ကျွတ်ပြီး မီးလင်းရွှေ</span>
<span class="val-gold" id="netKpy">၀ကျပ် ၀ပဲ ၀ရွေး</span>
</div>
<hr style="border: 0; border-top: 1px solid #24334d; margin: 6px 0;">
<div class="res-row">
<span class="res-lbl">Gram အလေးချိန်</span>
<span class="val-emerald" id="mainGram">0.000 g</span>
</div>
<div class="res-row">
<span class="res-lbl">ကျသင့်ငွေ (တွင်းထွက်စျေး)</span>
<span class="val-white" id="rawTotalPrice">၀ ကျပ်</span>
</div>
<div class="res-row">
<span class="res-lbl">ကျသင့်ငွေ (မီးလင်းစျေး)</span>
<span class="val-white" id="mainPrice">၀ ကျပ်</span>
</div>
</div>

<!-- အခြား စံနှုန်းများ -->
<div class="cmp-wrap">
<div class="cmp-head">အခြားစံနှုန်း နှိုင်းယှဉ်ချက်</div>

<div class="cmp-item">
<span class="cmp-tag" id="cLabel1">16.6g</span>
<div>
<span class="cmp-val" id="cKpy1">၀ကျပ် ၀ပဲ ၀ရွေး</span>
<span class="cmp-sub" id="cGram1">(0g)</span>
</div>
</div>

<div class="cmp-item">
<span class="cmp-tag" id="cLabel2">16.329g</span>
<div>
<span class="cmp-val" id="cKpy2">၀ကျပ် ၀ပဲ ၀ရွေး</span>
<span class="cmp-sub" id="cGram2">(0g)</span>
</div>
</div>
</div>
</div>

<script>
function autoCalcRawPrice() {
let goldPrice = parseFloat(document.getElementById('goldPrice').value) || 0;
let wasteYew = parseFloat(document.getElementById('wasteYew').value) || 0;
let std = document.getElementById('gramStandard').value;
let yewPerKyat = (std === "1") ? 120 : 128;

if (goldPrice > 0 && wasteYew >= 0) {
let calculatedRawPrice = goldPrice - ((goldPrice / yewPerKyat) * wasteYew);
document.getElementById('rawPrice').value = Math.round(calculatedRawPrice);
}
}

function formatYewToKPY(totalYew, yewPerKyat, yewPerPe) {
if (totalYew <= 0) return "၀ကျပ် ၀ပဲ ၀ရွေး";
let k = Math.floor(totalYew / yewPerKyat);
let remainY = totalYew - (k * yewPerKyat);
let p = Math.floor(remainY / yewPerPe);
let y = remainY - (p * yewPerPe);

let formattedY = parseFloat(y.toFixed(2));
return k + "ကျပ် " + p + "ပဲ " + formattedY + "ရွေး";
}

function gramToKPY(totalGram, targetStd) {
let totalYew = 0;
let yewPerKyat = 128;
let yewPerPe = 8;

if (targetStd === 1) {
yewPerKyat = 120;
yewPerPe = 7.5;
totalYew = totalGram * (120 / 16.6);
} else if (targetStd === 2) {
totalYew = totalGram * (128 / 16.606);
} else if (targetStd === 3) {
totalYew = totalGram * (128 / 16.329325);
}

return formatYewToKPY(totalYew, yewPerKyat, yewPerPe);
}

function calculateFromGram() {
let gVal = parseFloat(document.getElementById('inputGram').value) || 0;
let std = document.getElementById('gramStandard').value;

let yewPerKyat = (std === "1") ? 120 : 128;
let yewPerPe = (std === "1") ? 7.5 : 8;

let totalYew = 0;
if (std === "1") totalYew = gVal * (120 / 16.6);
else if (std === "2") totalYew = gVal * (128 / 16.606);
else if (std === "3") totalYew = gVal * (128 / 16.329325);

let k = Math.floor(totalYew / yewPerKyat);
let remainY = totalYew - (k * yewPerKyat);
let p = Math.floor(remainY / yewPerPe);
let y = remainY - (p * yewPerPe);

document.getElementById('kyat').value = k || '';
document.getElementById('pe').value = p || '';
document.getElementById('yew').value = y ? y.toFixed(2) : '';

calculateAll();
}

function calculateFromKPY() {
let k = parseFloat(document.getElementById('kyat').value) || 0;
let p = parseFloat(document.getElementById('pe').value) || 0;
let y = parseFloat(document.getElementById('yew').value) || 0;
let std = document.getElementById('gramStandard').value;

let yewPerKyat = (std === "1") ? 120 : 128;
let yewPerPe = (std === "1") ? 7.5 : 8;

let totalYew = (k * yewPerKyat) + (p * yewPerPe) + y;
let totalG = 0;

if (std === "1") totalG = totalYew * (16.6 / 120);
else if (std === "2") totalG = totalYew * (16.606 / 128);
else if (std === "3") totalG = totalYew * (16.329325 / 128);

document.getElementById('inputGram').value = totalG ? totalG.toFixed(3) : '';

calculateAll();
}

function calculateAll() {
let k = parseFloat(document.getElementById('kyat').value) || 0;
let p = parseFloat(document.getElementById('pe').value) || 0;
let y = parseFloat(document.getElementById('yew').value) || 0;

let rawPrice = parseFloat(document.getElementById('rawPrice').value) || 0;
let goldPrice = parseFloat(document.getElementById('goldPrice').value) || 0;
let wasteYewRate = parseFloat(document.getElementById('wasteYew').value) || 0;

let std = document.getElementById('gramStandard').value;

let yewPerKyat = (std === "1") ? 120 : 128;
let yewPerPe = (std === "1") ? 7.5 : 8;

let rawTotalYew = (k * yewPerKyat) + (p * yewPerPe) + y;
let rawKyatEquivalent = rawTotalYew / yewPerKyat;

let totalWasteYew = rawKyatEquivalent * wasteYewRate;
let netTotalYew = Math.max(0, rawTotalYew - totalWasteYew);

document.getElementById('netKpy').innerText = formatYewToKPY(netTotalYew, yewPerKyat, yewPerPe);

let mainG = 0;
if (std === "1") {
mainG = netTotalYew * (16.6 / 120);
document.getElementById('cLabel1').innerText = "16.606g";
document.getElementById('cKpy1').innerText = gramToKPY(mainG, 2);
document.getElementById('cGram1').innerText = "(" + mainG.toFixed(2) + "g)";

document.getElementById('cLabel2').innerText = "16.329g";
document.getElementById('cKpy2').innerText = gramToKPY(mainG, 3);
document.getElementById('cGram2').innerText = "(" + mainG.toFixed(2) + "g)";

} else if (std === "2") {
mainG = netTotalYew * (16.606 / 128);
document.getElementById('cLabel1').innerText = "16.6g";
document.getElementById('cKpy1').innerText = gramToKPY(mainG, 1);
document.getElementById('cGram1').innerText = "(" + mainG.toFixed(2) + "g)";

document.getElementById('cLabel2').innerText = "16.329g";
document.getElementById('cKpy2').innerText = gramToKPY(mainG, 3);
document.getElementById('cGram2').innerText = "(" + mainG.toFixed(2) + "g)";

} else if (std === "3") {
mainG = netTotalYew * (16.329325 / 128);
document.getElementById('cLabel1').innerText = "16.6g";
document.getElementById('cKpy1').innerText = gramToKPY(mainG, 1);
document.getElementById('cGram1').innerText = "(" + mainG.toFixed(2) + "g)";

document.getElementById('cLabel2').innerText = "16.606g";
document.getElementById('cKpy2').innerText = gramToKPY(mainG, 2);
document.getElementById('cGram2').innerText = "(" + mainG.toFixed(2) + "g)";
}

document.getElementById('mainGram').innerText = mainG.toFixed(3) + ' g';

let rawTotalPrice = rawKyatEquivalent * rawPrice;
let netKyatEquivalent = netTotalYew / yewPerKyat;
let netTotalPrice = netKyatEquivalent * goldPrice;

document.getElementById('rawTotalPrice').innerText = Math.round(rawTotalPrice).toLocaleString() + ' ကျပ်';
document.getElementById('mainPrice').innerText = Math.round(netTotalPrice).toLocaleString() + ' ကျပ်';
}
</script>

</body>
</html>
